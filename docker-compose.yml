services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: groe
      POSTGRES_USER: groe
      POSTGRES_PASSWORD: groe
    volumes:
      - groe_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U groe -d groe"]
      interval: 5s
      timeout: 5s
      retries: 10
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://groe:groe@db:5432/groe
      JWT_SECRET: local-development-secret-change-me
      CORS_ORIGINS: http://localhost:8000
      AUTO_SEED: "true"
    depends_on:
      db:
        condition: service_healthy
volumes:
  groe_postgres:
