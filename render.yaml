services:
  - type: web
    name: groe-fullstack-beta
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/ready
    autoDeployTrigger: commit
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: groe-fullstack-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ACCESS_TOKEN_MINUTES
        value: "30"
      - key: REFRESH_TOKEN_DAYS
        value: "14"
      - key: AUTO_SEED
        value: "true"
      - key: DB_WAIT_ATTEMPTS
        value: "90"
      - key: DB_WAIT_SECONDS
        value: "2"
      - key: AI_PROVIDER
        value: openai
      - key: OPENAI_MODEL
        value: gpt-5-mini
      - key: LOG_LEVEL
        value: INFO
      - key: OPEN_METEO_BASE_URL
        value: https://api.open-meteo.com/v1
      - key: OPEN_METEO_GEOCODING_URL
        value: https://geocoding-api.open-meteo.com/v1

databases:
  - name: groe-fullstack-db
    databaseName: groe
    user: groe
    plan: free
    region: singapore
    ipAllowList: []
